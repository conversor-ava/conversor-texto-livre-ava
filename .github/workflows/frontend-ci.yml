name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  security:
    name: Check Sensitive Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tracked sensitive files
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          tracked_files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          patterns = [
              r"(^|/)\.env$",
              r"(^|/)\.env\.(?!example$|sample$|template$)",
              r"(^|/)id_rsa$",
              r"(^|/)id_ed25519$",
              r"\.(pem|p12|pfx|key)$",
              r"(^|/)credentials\.json$",
              r"(^|/)service-account.*\.json$",
          ]

          sensitive_files = [
              path
              for path in tracked_files
              if path and any(
                  re.search(pattern, path, re.IGNORECASE)
                  for pattern in patterns
              )
          ]

          if sensitive_files:
              print("Arquivos potencialmente sensíveis encontrados:")
              for path in sensitive_files:
                  print(f"- {path}")
              sys.exit(1)

          print("Nenhum arquivo sensível identificado pelos padrões.")
          PY

  frontend:
    name: Lint, Typecheck, Tests and Build
    runs-on: ubuntu-latest
    needs: security

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build